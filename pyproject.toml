[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-autoharness"
version = "0.1.1"
description = "Self-learning skills for Codex: learn, consolidate, improve, and retire skills from real sessions."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Shad"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
codex-autoharness = "codex_autoharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_autoharness = ["lib/*.md", "lib/*.toml", "*.json", "*.md", "prompts/*.md", "assets/**/*"]
